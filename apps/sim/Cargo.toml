[package]
name = "muesli-sim"
description = "Muesli in a browser: the real engine with fake adapters and the real web UI, in either skin, driven by hand or by scenarios. For development and the UI tests; never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "muesli-sim"
path = "src/main.rs"

[dependencies]
muesli-core = { path = "../../crates/core" }
muesli-engine = { path = "../../crates/engine" }
muesli-platform-fake = { path = "../../crates/platform-fake" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
