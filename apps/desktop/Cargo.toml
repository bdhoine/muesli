[package]
name = "muesli-app"
description = "Muesli: on-device meeting transcription for the menu bar and system tray."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "muesli_app_lib"
path = "src/lib.rs"

[[bin]]
name = "muesli"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
muesli-core = { path = "../../crates/core" }
muesli-whisper = { path = "../../crates/whisper" }
muesli-engine = { path = "../../crates/engine" }
muesli-import = { path = "../../crates/import", features = ["whisper"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
dirs = "5"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
muesli-platform-macos = { path = "../../crates/platform-macos" }

[target.'cfg(windows)'.dependencies]
muesli-platform-windows = { path = "../../crates/platform-windows" }

# Linux is for development only: real folders and clock, fakes for everything else.
[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
muesli-platform-common = { path = "../../crates/platform-common" }
muesli-platform-fake = { path = "../../crates/platform-fake" }
