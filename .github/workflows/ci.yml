name: CI

# Started by hand (Actions tab, or `gh workflow run CI`). Put `push` and `pull_request` here to run
# it automatically. Rust runs on macOS, Windows and Linux; the Swift app is tested on macOS.
on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace
      # Linux has no app (no WebKitGTK here) and no audio capture; test the portable crates.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p muesli-core -p muesli-mcp -p muesli-detect -p muesli-audio -p muesli-system -p muesli-import

  swift:
    name: Swift (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Build the shared Rust core for Swift
        run: scripts/build-ffi.sh
      - run: swift test
        working-directory: macos

  icons:
    name: Generated files are current (icons, plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-icons.py --check
      - run: python3 scripts/sync-plugin.py --check
      - run: node --test scripts/plugin-launcher.test.js
