name: CI

# Started by hand (Actions tab, or `gh workflow run CI`). There are no macOS jobs: GitHub's macOS
# runners are not available to this private repository, so the Swift app is tested locally
# (`cd macos && swift test`). Put `push` and `pull_request` back here to run it automatically.
on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - if: matrix.os == 'windows-latest'
        run: cargo test --workspace
      # Linux has no app (no WebKitGTK here) and no audio capture; test the portable crates.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p muesli-core -p muesli-mcp -p muesli-detect -p muesli-audio -p muesli-system -p muesli-import

  icons:
    name: Generated files are current (icons, plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-icons.py --check
      - run: python3 scripts/sync-plugin.py --check
      - run: node --test scripts/plugin-launcher.test.js
