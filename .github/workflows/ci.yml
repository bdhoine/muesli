name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace
      # Linux has no app (no WebKitGTK here) and no audio capture; test the portable crates.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p muesli-core -p muesli-mcp -p muesli-detect -p muesli-audio -p muesli-notify

  swift:
    name: Swift (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: macos
      - name: Windows app icons match assets/brand
        run: python3 scripts/sync-icons.py --check
