name: Tests
run-name: Tests on ${{ github.ref_name }} (${{ github.sha }})

# Started by hand (Actions tab, or `gh workflow run Tests`). Put `push` and `pull_request` here to run
# it automatically. Rust runs on macOS, Windows and Linux.
on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests, ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS }
          - { os: windows-latest, label: Windows }
          - { os: ubuntu-latest, label: "Linux (fakes; development only)" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # LocalVQE, built on macOS and Windows (crates/aec)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux is not a product; the app builds there with the fake adapters, which needs WebKitGTK.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: UI tests (simulator, both skins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p muesli-sim
      - run: npm ci
        working-directory: apps/sim
      - run: npx playwright install --with-deps chromium
        working-directory: apps/sim
      - run: node --test tests/*.test.mjs
        working-directory: apps/sim

  icons:
    name: Generated files up to date (icons, plugin, launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-icons.py --check
      - run: python3 scripts/sync-plugin.py --check
      - run: node --test scripts/plugin-launcher.test.js
