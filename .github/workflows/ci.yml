name: Tests
run-name: Tests on ${{ github.ref_name }} (${{ github.sha }})

# On every push and pull request, and by hand (Actions tab, or `gh workflow run Tests`). Rust runs on
# macOS, Windows and Linux.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests, ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS }
          - { os: windows-latest, label: Windows }
          - { os: ubuntu-latest, label: "Linux (fakes; development only)" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # LocalVQE, built on macOS and Windows (crates/aec)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows: whisper.cpp builds its Vulkan backend (VULKAN_SDK, glslc for the shaders), and the
      # app bundles the Vulkan loader. Keep the version in step with scripts/fetch-vulkan-loader.py.
      - name: Install the Vulkan SDK and fetch the loader (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.328.1
        run: |
          $installer = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -sSLf -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $installer --root "C:\VulkanSDK\$env:VULKAN_VERSION" --accept-licenses --default-answer --confirm-command install | Out-Null
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"
          python scripts/fetch-vulkan-loader.py
      # Linux is not a product; the app builds there with the fake adapters, which needs WebKitGTK.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: UI tests (simulator, both skins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p muesli-sim
      - run: npm ci
        working-directory: apps/sim
      - run: npx playwright install --with-deps chromium
        working-directory: apps/sim
      - run: node --test tests/*.test.mjs
        working-directory: apps/sim

  icons:
    name: Generated files up to date (icons, plugin, launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-icons.py --check
      - run: python3 scripts/sync-plugin.py --check
      - run: node --test scripts/plugin-launcher.test.js
