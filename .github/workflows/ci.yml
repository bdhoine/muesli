name: Tests
run-name: Tests on ${{ github.ref_name }} (${{ github.sha }})

# Started by hand (Actions tab, or `gh workflow run Tests`). Put `push` and `pull_request` here to run
# it automatically. Rust runs on macOS, Windows and Linux; the Swift app is tested on macOS.
on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests, ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS }
          - { os: windows-latest, label: Windows }
          - { os: ubuntu-latest, label: "Linux (portable crates only)" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace
      # Linux has no app (no WebKitGTK here) and no audio capture; test the portable crates.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p muesli-core -p muesli-mcp -p muesli-detect -p muesli-audio -p muesli-system -p muesli-import

  swift:
    name: Swift tests, macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the shared Rust core for Swift
        run: scripts/build-ffi.sh
      - run: swift test
        working-directory: macos

  icons:
    name: Generated files up to date (icons, plugin, launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync-icons.py --check
      - run: python3 scripts/sync-plugin.py --check
      - run: node --test scripts/plugin-launcher.test.js
