name: Build installers
run-name: Build installers for ${{ github.ref_name }} (${{ github.sha }})

# Builds the installers of the one Tauri app as downloadable artifacts: the Windows installers
# (.msi/.exe) and the macOS disk image (.dmg; unsigned, since CI has no certificate, so macOS asks
# before it opens it).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows installer (x64)", os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: "macOS app (Apple Silicon)", os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the MCP server and the Claude Desktop extension
        shell: bash
        run: |
          cargo build --release -p muesli-mcp --target ${{ matrix.target }}
          ext=""; if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p apps/desktop/binaries
          cp "target/${{ matrix.target }}/release/muesli-mcp$ext" "apps/desktop/binaries/muesli-mcp-${{ matrix.target }}$ext"
          python3 scripts/build-mcpb.py "target/${{ matrix.target }}/release/muesli-mcp$ext"
      - name: Build the app
        working-directory: apps/desktop
        run: cargo tauri build --target ${{ matrix.target }} --config tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: muesli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
