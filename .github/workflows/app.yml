name: Build installers
run-name: Build installers for ${{ github.ref_name }} (${{ github.sha }})

# Builds the installers as downloadable artifacts: the macOS app (Muesli.app in a zip, signed ad hoc
# because CI has no certificate, so macOS asks before it opens it) and the Windows installers (.msi/.exe).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows installer (x64)", os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the MCP server and the Claude Desktop extension
        shell: bash
        run: |
          cargo build --release -p muesli-mcp --target ${{ matrix.target }}
          ext=""; if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.target }}/release/muesli-mcp$ext" "src-tauri/binaries/muesli-mcp-${{ matrix.target }}$ext"
          python3 ../scripts/build-mcpb.py "target/${{ matrix.target }}/release/muesli-mcp$ext"
      - name: Build the app
        run: cargo tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: muesli-${{ matrix.target }}
          path: |
            windows/target/${{ matrix.target }}/release/bundle/**/*.msi
            windows/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  macos:
    name: Build macOS app (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Build Muesli.app
        run: macos/build.sh
      - name: Check what was built
        run: |
          test -x macos/Muesli.app/Contents/MacOS/Muesli
          test -x macos/Muesli.app/Contents/MacOS/muesli-mcp
          test -f macos/Muesli.app/Contents/Resources/Muesli.mcpb
          codesign --verify --deep macos/Muesli.app
          macos/Muesli.app/Contents/MacOS/muesli-mcp --version
      - name: Zip the app
        run: ditto -c -k --keepParent macos/Muesli.app macos/Muesli-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: muesli-aarch64-apple-darwin
          path: macos/Muesli-macos-arm64.zip
