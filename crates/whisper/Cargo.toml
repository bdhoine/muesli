[package]
name = "muesli-whisper"
description = "Muesli's speech model manager (download, validation) and whisper.cpp transcriber."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["transcribe"]
# whisper.cpp itself. Off, the model manager still builds (needs no C++ toolchain).
transcribe = ["dep:whisper-rs"]

[dependencies]
muesli-core = { path = "../core" }
ureq = "3"
whisper-rs = { version = "0.16", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
