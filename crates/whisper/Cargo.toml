[package]
name = "muesli-whisper"
description = "Muesli's speech model manager (download, validation) and whisper.cpp transcriber."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["transcribe"]
# whisper.cpp itself. Off, the model manager still builds (needs no C++ toolchain).
transcribe = ["dep:whisper-rs"]
# macOS: whisper.cpp's encoder through Core ML (the Neural Engine) when
# ggml-large-v3-turbo-encoder.mlmodelc lies next to the model, the normal encoder otherwise.
# Off: only measured so far (docs/AUDIO-SPIKE.md).
coreml = ["whisper-rs?/coreml"]

[dependencies]
muesli-core = { path = "../core" }
ureq = "3"
whisper-rs = { version = "0.16", optional = true }
# Unpacks the Core ML encoder (deflate only, pure Rust).
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

# Windows: the graphics card through Vulkan when its driver is there, the CPU otherwise (ggml
# falls back by itself). Building needs the Vulkan SDK (VULKAN_SDK); the app bundles the loader
# (scripts/fetch-vulkan-loader.py) so it also starts on a PC without a GPU driver.
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["vulkan"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
