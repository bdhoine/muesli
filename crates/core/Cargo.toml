[package]
name = "muesli-core"
description = "Muesli's platform-neutral core: models, store, preferences, detection logic. Port of Swift MuesliCore."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
sys-locale = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
semver = "1"

[dev-dependencies]
muesli-platform-fake = { path = "../platform-fake" }
