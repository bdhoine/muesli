[package]
name = "muesli-platform-windows"
description = "Muesli's Windows adapters: WASAPI sessions for meeting detection, toasts with answer buttons, privacy switches, the Run key for start at login."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
muesli-core = { path = "../core" }
muesli-platform-common = { path = "../platform-common", features = ["capture"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-registry = "0.6"
windows = { version = "0.62", features = [
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
] }
