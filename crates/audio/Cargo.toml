[package]
name = "muesli-audio"
description = "Audio for Muesli without the OS: resampling to 16 kHz mono and decoding audio files."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rubato = "5"
audioadapter-buffers = "5"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "wav", "ogg", "vorbis", "pcm", "alac"] }

[dev-dependencies]
tempfile = "3"
