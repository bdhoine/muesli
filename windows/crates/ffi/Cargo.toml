[package]
name = "muesli-ffi"
description = "UniFFI bindings of muesli-core for the Swift macOS app. Thin wrappers only: logic stays in muesli-core."
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
muesli-core = { path = "../core" }
uniffi = "0.32"
chrono = "0.4"
