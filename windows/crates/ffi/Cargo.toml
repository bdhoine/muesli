[package]
name = "muesli-ffi"
description = "UniFFI bindings of muesli-core for the Swift macOS app. Thin wrappers only: logic stays in muesli-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]
# On-device transcription (whisper.cpp through whisper-rs). Needs cmake and a C++ toolchain; the
# macOS app build turns it on, plain `cargo test --workspace` does not need it.
whisper = ["dep:muesli-whisper", "dep:muesli-import", "muesli-import/whisper"]

[dependencies]
muesli-core = { path = "../core" }
uniffi = "0.32"
chrono = "0.4"
muesli-whisper = { path = "../whisper", optional = true }
muesli-import = { path = "../import", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
